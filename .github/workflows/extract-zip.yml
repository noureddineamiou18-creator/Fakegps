
name: Extract and organize FakeGPSPro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'FakeGPSPro-GitHub-Paths-Clean*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"

          rsync -a "$RUNNER_TEMP/project/" ./

          rm "$ZIP"

      - name: Commit organized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Organize FakeGPSPro project structure"
            git push
          fi
